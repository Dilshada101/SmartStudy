{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="chat-container" style="max-width:700px;margin:auto;padding:20px;">
    <h2>💬 Chat with AI</h2>

    <div id="chat-box" style="border:1px solid #ddd;padding:12px;height:360px;overflow-y:auto;background:#fafafa;border-radius:8px;"></div>

    <form id="chat-form" style="display:flex;gap:8px;margin-top:12px;">
        {% csrf_token %}
        <input type="text" id="user-message" name="message" placeholder="Type your message..." style="flex:1;padding:10px;border-radius:6px;border:1px solid #ddd;">
        <button type="submit" style="padding:10px 16px;border-radius:6px;">Send</button>
    </form>
</div>

<script>
/* CSRF helper – standard Django cookie-reading function */
function getCookie(name) {
    const cookies = document.cookie ? document.cookie.split('; ') : [];
    for (let i = 0; i < cookies.length; i++) {
        const parts = cookies[i].split('=');
        const key = parts.shift();
        const value = parts.join('=');
        if (key === name) return decodeURIComponent(value);
    }
    return null;
}
const csrftoken = getCookie('csrftoken');

function appendMessage(who, message) {
    const box = document.getElementById('chat-box');
    const el = document.createElement('div');
    el.style.margin = '8px 0';
    el.innerHTML = `<strong>${who}:</strong> <span>${message}</span>`;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
}

document.getElementById('chat-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const input = document.getElementById('user-message');
    const message = input.value.trim();
    if (!message) return;

    appendMessage('You', message);
    input.value = '';

    try {
        const resp = await fetch("{% url 'send_message' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8',
                'X-CSRFToken': csrftoken
            },
            body: new URLSearchParams({ message })
        });

        if (!resp.ok) {
            // read returned JSON message if available
            let data;
            try { data = await resp.json(); } catch(e){ data = null; }
            const serverMsg = data && data.message ? data.message : `Server returned ${resp.status}`;
            appendMessage('AI', `Error: ${serverMsg}`);
            return;
        }

        const data = await resp.json();
        appendMessage('AI', data.message);
    } catch (err) {
        appendMessage('AI', 'Network error: could not reach server.');
        console.error('Fetch error:', err);
    }
});
</script>
{% endblock %}
