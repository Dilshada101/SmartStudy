{% extends 'base.html' %}
{% load static %}

{% block title %}Login - SmartStudy{% endblock %}

{% block content %}
<section style="
    height: 100vh;
    background-color: #0a3980ff; 
    display: flex; 
    justify-content: center; 
    align-items: flex-start; 
    padding-top: 40px;  /* moved up */
    overflow: hidden;">

    <div style="
        background: white; 
        padding: 25px 30px; 
        border-radius: 15px; 
        box-shadow: 0 6px 20px rgba(0,0,0,0.25); 
        width: 100%; 
        max-width: 340px; 
        text-align: center;">
        
        <img src="{% static 'images/logo.png' %}" 
             alt="SmartStudy Logo" 
             style="width: 80px; height: auto; margin-bottom: 10px;">
             
        <h2 style="color: #0d6efd; margin-bottom: 6px; font-size: 1.4em;">Welcome Back</h2>
        <p style="color: #555; margin-bottom: 18px; font-size: 0.9em;">
            Log in to continue your learning journey
        </p>

        <form method="POST" style="display: flex; flex-direction: column; gap: 12px;">
            {% csrf_token %}
            
            <input type="text" name="username" placeholder="Username" 
                   required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95em;">
            
            <input type="password" name="password" placeholder="Password" 
                   required style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95em;">

            <button type="submit" style="
                background-color: #0d6efd; 
                color: white; 
                font-weight: bold;
                padding: 10px; 
                border: none; 
                border-radius: 8px; 
                font-size: 1em;
                cursor: pointer;
                transition: 0.3s;">
                Login
            </button>

            <p style="margin-top: 10px; color: #555; font-size: 0.9em;">
                Don't have an account? 
                <a href="{% url 'signup' %}" style="color: #0d6efd; text-decoration: none; font-weight: 600;">
                    Sign up
                </a>
            </p>
        </form>
    </div>
</section>
{% endblock %}
