{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}SmartStudy{% endblock %}</title>

  <!-- Optional: Bootstrap CSS CDN (keeps layout neat) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

  <!-- Header -->
  <header style="background-color:#0d6efd; color:white; padding:12px 28px;">
    <nav class="d-flex align-items-center justify-content-between">
      <!-- left: logo + name -->
      <div class="d-flex align-items-center">
        <img src="{% static 'images/Logo.png' %}" alt="SmartStudy Logo"
             style="width:64px; height:64px; object-fit:cover; border-radius:8px; box-shadow:0 4px 10px rgba(0,0,0,0.2);">
        <span style="font-size:1.6rem; font-weight:600; margin-left:14px; color:white;">SmartStudy</span>
      </div>

      <!-- right: nav -->
      <ul class="nav" style="gap:20px;">
        <li class="nav-item"><a class="nav-link" style="color:white;" href="{% url 'home' %}">Home</a></li>
        <li class="nav-item"><a class="nav-link" style="color:white;" href="{% url 'about' %}">About</a></li>
        <li class="nav-item"><a class="nav-link" style="color:white;" href="{% url 'contact' %}">Contact</a></li>
        <li class="nav-item">
  <a href="{% url 'signup' %}" 
     class="nav-link btn px-3 rounded-pill" 
     style="background-color:#28a745; color:white; font-weight:600;">
     Sign Up
  </a>
</li>

      </ul>
    </nav>
  </header>

  <!-- Main content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="text-center py-3" style="background:#0d6efd; color:white; margin-top:40px;">
    <p class="mb-0">© 2025 SmartStudy | All rights reserved.</p>
  </footer>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
